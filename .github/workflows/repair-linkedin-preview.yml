name: Repair LinkedIn preview

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-linkedin-preview.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build durable social preview
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          out = Path("assets/how-strong-is-the-relationship-preview-v2.png")
          out.parent.mkdir(parents=True, exist_ok=True)

          # Prefer the artwork already committed for this activity if Pillow can
          # decode it. Re-render it as a standard non-interlaced PNG, matching
          # the known-good pattern used by Pick the Cardinality.
          source = Path("how-strong-is-the-relationship/how-strong-is-the-relationship-og.jpg")
          try:
              with Image.open(source) as im:
                  im.load()
                  im = im.convert("RGB").resize((1200, 630), Image.Resampling.LANCZOS)
                  im.save(out, "PNG", optimize=True)
              print("Converted existing artwork:", out)
          except Exception as exc:
              print("Existing artwork could not be decoded; generating fallback:", exc)
              W, H = 1200, 630
              im = Image.new("RGB", (W, H), "#0e4785")
              px = im.load()
              for y in range(H):
                  for x in range(W):
                      t = (x + y * .35) / (W + H * .35)
                      px[x, y] = (int(11 + 16*t), int(58 + 47*t), int(108 + 82*t))

              d = ImageDraw.Draw(im)
              font_paths = [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf",
              ]
              regular_paths = [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
                  "/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf",
              ]
              def font(size, bold=False):
                  paths = font_paths if bold else regular_paths
                  for p in paths:
                      if Path(p).exists():
                          return ImageFont.truetype(p, size)
                  return ImageFont.load_default()

              d.text((48, 34), "BUSINESS DATA MANAGEMENT  ·  INTERACTIVE ACTIVITY",
                     font=font(22, True), fill="#dbeafe")
              d.text((48, 78), "How Strong is the", font=font(64, True), fill="white")
              d.text((48, 150), "Relationship?", font=font(64, True), fill="white")
              d.text((48, 234), "Strong (Identifying) vs. Weak (Non-identifying) Relationships",
                     font=font(28, True), fill="#f8fafc")
              d.text((48, 274), "Read the keys. Then draw the line.",
                     font=font(25), fill="#dbeafe")

              # Working Artifact badge
              d.rounded_rectangle((850, 48, 1138, 112), radius=14, outline="#dbeafe", width=2)
              d.text((891, 67), "Working Artifact", font=font(27, True), fill="white")

              # Main light panel
              d.rounded_rectangle((28, 330, 1172, 548), radius=18, fill="#f8fbff")
              d.line((600, 350, 600, 526), fill="#cbd5e1", width=2)

              def box(x1, y1, x2, y2, title, rows):
                  d.rounded_rectangle((x1,y1,x2,y2), radius=8, fill="white", outline="#194f82", width=3)
                  d.line((x1,y1+42,x2,y1+42), fill="#94a3b8", width=2)
                  tw = d.textbbox((0,0), title, font=font(19,True))[2]
                  d.text(((x1+x2-tw)/2, y1+10), title, font=font(19,True), fill="#123b63")
                  yy=y1+55
                  for tag, txt in rows:
                      if tag:
                          d.text((x1+14,yy), tag, font=font(16,True), fill="#17486f")
                      d.text((x1+72,yy), txt, font=font(16, tag=="PK"), fill="#152534")
                      yy += 30

              d.text((140, 347), "Strong (Identifying)", font=font(22,True), fill="#123b63")
              box(58, 390, 278, 520, "PARENT", [("PK","parent_id"),("","parent_name")])
              box(392, 390, 572, 520, "CHILD", [("PK, FK","parent_id"),("PK","line_num")])
              d.line((278,455,392,455), fill="#17486f", width=5)
              d.line((292,441,292,469), fill="#17486f", width=4)
              d.line((377,455,392,442), fill="#17486f", width=4)
              d.line((377,455,392,468), fill="#17486f", width=4)

              d.text((745, 347), "Weak (Non-identifying)", font=font(22,True), fill="#123b63")
              box(630, 390, 850, 520, "PARENT", [("PK","parent_id"),("","parent_name")])
              box(964, 390, 1144, 520, "CHILD", [("PK","child_id"),("FK","parent_id")])
              # dashed relationship
              x=850
              while x < 964:
                  d.line((x,455,min(x+13,964),455), fill="#17486f", width=5)
                  x += 23
              d.line((864,441,864,469), fill="#17486f", width=4)
              d.line((949,455,964,442), fill="#17486f", width=4)
              d.line((949,455,964,468), fill="#17486f", width=4)

              d.text((48, 575), "Free interactive browser activity", font=font(20,True), fill="white")
              brand = "EXAPTER ENDAPTER"
              bw = d.textbbox((0,0), brand, font=font(22,True))[2]
              d.text((W-bw-48, 575), brand, font=font(22,True), fill="white")
              im.save(out, "PNG", optimize=True)

          with Image.open(out) as check:
              print("Preview:", check.size, check.format, out.stat().st_size, "bytes")
              assert check.size == (1200, 630)
              assert check.format == "PNG"

          page = Path("how-strong-is-the-relationship/index.html")
          html = page.read_text(encoding="utf-8")
          old = "https://workingartifact.github.io/how-strong-is-the-relationship/how-strong-is-the-relationship-og.jpg"
          new = "https://workingartifact.github.io/assets/how-strong-is-the-relationship-preview-v2.png"
          html = html.replace(old, new)
          html = html.replace(
              '<meta property="og:image:type" content="image/jpeg">',
              '<meta property="og:image:type" content="image/png">'
          )
          html = html.replace(
              '<meta property="og:image:height" content="627">',
              '<meta property="og:image:height" content="630">'
          )
          page.write_text(html, encoding="utf-8")
          PY

      - name: Commit repaired preview
        run: |
          git config user.name "workingartifact"
          git config user.email "318367754+workingartifact@users.noreply.github.com"
          git add assets/how-strong-is-the-relationship-preview-v2.png how-strong-is-the-relationship/index.html
          git commit -m "Repair LinkedIn preview image" || true
          git push

      - name: Remove one-shot workflow
        run: |
          git pull --rebase
          git rm .github/workflows/repair-linkedin-preview.yml
          git commit -m "Remove one-shot LinkedIn preview repair workflow"
          git push
