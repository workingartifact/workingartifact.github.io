name: Deploy How Strong is the Relationship

on:
  push:
    paths:
      - '.github/workflows/deploy-how-strong.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct activity
        shell: bash
        run: |
          mkdir -p how-strong-is-the-relationship downloads
          printf '%s' '' | base64 -d | gunzip > how-strong-is-the-relationship/index.html
          cp how-strong-is-the-relationship/index.html downloads/how-strong-is-the-relationship.html
      - name: Add project 04 without changing footer
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          if "project 04" not in s:
              article = """
          
          <article class="project">
            <p class="project-number">project 04</p>
            <h3>How Strong is the Relationship?</h3>
            <p class="project-description">An interactive learning artifact for distinguishing strong (identifying) and weak (non-identifying) relationships by reading parent/determinant and child/dependent key structure.</p>
            <p class="project-meta">INTERACTIVE ACTIVITY / HTML / VERSION 1.0.0</p>
            <nav class="project-links" aria-label="How Strong is the Relationship links">
              <a href="how-strong-is-the-relationship/">launch activity →</a>
              <a href="downloads/how-strong-is-the-relationship.html" download>download standalone HTML</a>
              <a href="https://github.com/workingartifact/workingartifact.github.io/blob/main/how-strong-is-the-relationship/index.html">view source ↗</a>
            </nav>
          </article>"""
              start = s.index('<p class="project-number">project 03</p>')
              close = s.index('</article>', start) + len('</article>')
              s = s[:close] + article + s[close:]
              p.write_text(s)
      - name: Commit deployment
        shell: bash
        run: |
          git config user.name "workingartifact-deploy"
          git config user.email "actions@users.noreply.github.com"
          git add how-strong-is-the-relationship/index.html downloads/how-strong-is-the-relationship.html index.html
          git rm .github/workflows/deploy-how-strong.yml
          git commit -m "Publish How Strong is the Relationship"
          git push
