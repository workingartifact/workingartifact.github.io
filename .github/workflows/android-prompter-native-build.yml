name: Build Native Prompter APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/exapter-endapter-prompter-native/**'
      - '.github/workflows/android-prompter-native-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android/exapter-endapter-prompter-native
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: exapter-endapter-prompter-native-v0.1
          path: android/exapter-endapter-prompter-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Pages repository
        run: |
          mkdir -p downloads
          cp android/exapter-endapter-prompter-native/app/build/outputs/apk/debug/app-debug.apk \
             downloads/exapter-endapter-prompter-native-v0.1.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/exapter-endapter-prompter-native-v0.1.apk
          if git diff --cached --quiet; then
            echo 'APK unchanged; nothing to publish.'
          else
            git commit -m 'Publish native prompter v0.1 APK [skip ci]'
            git push
          fi
