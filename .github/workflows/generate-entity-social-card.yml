name: Generate entity social card

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_entity_social_card.py"
      - ".github/workflows/generate-entity-social-card.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate social card
        run: python scripts/generate_entity_social_card.py

      - name: Commit generated image
        run: |
          git config user.name "workingartifact-actions"
          git config user.email "actions@users.noreply.github.com"
          git add assets/how-strong-is-the-entity-linkedin.jpg
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Generate How Strong is the Entity social preview [skip ci]"
          git push
